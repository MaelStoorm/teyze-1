# iPhone ve tarayıcı için web sürümü: main'e her birleştirmede GitHub Pages'e yayınlanır.
# © 2026 Egemen, MaelStoorm Studios. Tüm hakları saklıdır.
name: Web sürümü

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve web şablonlarını indir
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          unzip -q -j templates.tpz templates/version.txt templates/web_nothreads_release.zip templates/web_nothreads_debug.zip -d "$dir"
          rm templates.tpz godot.zip

      - name: Web için dışa aktar
        run: |
          ./godot --headless --import || true
          mkdir -p site
          ./godot --headless --export-release Web site/index.html
          test -s site/index.wasm && test -s site/index.pck
          cp -r docs/* site/
          rm -rf site/store

      - name: Gizlilik politikasını sitenin köküne koy
        # Play Console'daki bağlantı: https://maelstoorm.github.io/teyze-1/gizlilik.html
        run: |
          cp docs/gizlilik.html site/gizlilik.html
          test -s site/gizlilik.html
          grep -q "egementughan@gmail.com" site/gizlilik.html
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
