# Google Play için Android sürümü: main'e her gönderimde imzasız AAB üretir ve
# builds dalına fatma-teyze-unsigned.aab (ve commit.txt) olarak koyar. Yükleme
# anahtarıyla imza elle atılır, bkz. docs/store/YAYINLAMA.md. Derleme bozulursa
# builds dalına build-log.txt yazılır.
# © 2026 Egemen, MaelStoorm Studios. Tüm hakları saklıdır.
name: Android sürümü

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.2"
  BUNDLETOOL_VERSION: "1.18.2"
  AAB: build/fatma-teyze-unsigned.aab
  LOG: ${{ github.workspace }}/build-log.txt

defaults:
  run:
    shell: bash

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot, Android şablonu ve bundletool'u indir
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
            cd "$RUNNER_TEMP"
            curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
            curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mkdir -p "$dir"
            unzip -q -j templates.tpz templates/version.txt templates/android_source.zip -d "$dir"
            rm templates.tpz
            curl -fsSL -o bundletool.jar \
              "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
            ./godot --version
          } 2>&1 | tee -a "$LOG"

      - name: Gradle derleme şablonunu ve editör ayarlarını kur
        run: |
          {
            mkdir -p android/build
            unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
            echo "${GODOT_VERSION}.stable" > android/.build_version
            touch android/build/.gdignore
            chmod +x android/build/gradlew
            mkdir -p ~/.config/godot
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" \
              > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
            cat ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          } 2>&1 | tee -a "$LOG"

      - name: AAB olarak dışa aktar
        run: |
          {
            "$RUNNER_TEMP/godot" --headless --import || true
            mkdir -p build
            "$RUNNER_TEMP/godot" --headless --verbose --export-release Android "$AAB"
            test -s "$AAB"
          } 2>&1 | tee -a "$LOG"

      - name: İmzayı temizle ve AAB'yi denetle
        run: |
          python3 tools/aab_denetle.py "$AAB" --bundletool "$RUNNER_TEMP/bundletool.jar" 2>&1 | tee -a "$LOG"

      - name: AAB'yi builds dalına koy
        run: |
          out="$RUNNER_TEMP/builds"
          mkdir -p "$out"
          cp "$AAB" "$out/fatma-teyze-unsigned.aab"
          echo "$GITHUB_SHA" > "$out/commit.txt"
          cd "$out"
          git init -q -b builds
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "İmzasız AAB: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:builds

      - name: Hata günlüğünü builds dalına koy
        if: failure()
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          out="$RUNNER_TEMP/builds-log"
          if ! git clone -q --depth 1 -b builds "$remote" "$out"; then
            mkdir -p "$out" && git -C "$out" init -q -b builds
          fi
          cp "$LOG" "$out/build-log.txt"
          cd "$out"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Derleme hatası: ${GITHUB_SHA::7}"
          git push -qf "$remote" HEAD:builds
